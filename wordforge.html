<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE 🔤 WORD FORGE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c14'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
<style>
  :root{--text:#e7ecf3;--muted:#8791a3;--cyan:#5cc9dd;--purple:#9d8ad6;--stroke:rgba(255,255,255,.1);--green:#4fc596;--red:#e56b7b;--gold:#e3bd68}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 50% -10%,#141a30,#0a0c14 70%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .top{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  a.back{color:var(--text);text-decoration:none;background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600}
  h1{font-size:20px;margin:0;letter-spacing:1px}
  h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .best{font-size:12px;color:var(--muted)}
  .wrap{width:100%;max-width:640px}
  .card{border:1px solid var(--stroke);border-radius:20px;background:linear-gradient(180deg,#141a30,#0e1120);padding:18px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .hud b{color:var(--text);font-size:16px}
  .hud .sc{color:var(--gold);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  #timebar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:14px}
  #timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .25s linear}
  .cur{min-height:52px;border:1px dashed var(--stroke);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:12px;padding:6px;flex-wrap:wrap}
  .cur .ph{color:var(--muted);font-size:15px;font-weight:500;letter-spacing:0}
  .rack{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
  .tile{position:relative;width:52px;height:56px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;cursor:pointer;user-select:none;transition:.1s}
  .tile:active{transform:scale(.92)}
  .tile.used{opacity:.28;pointer-events:none}
  .tile .v{position:absolute;bottom:3px;right:5px;font-size:10px;font-weight:700;color:var(--muted)}
  .tile.mult{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .tile.mult .tag{position:absolute;top:2px;left:4px;font-size:9px;font-weight:800;color:var(--gold)}
  .tile.bonus{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
  .tile.bonus .tag{position:absolute;top:2px;left:4px;font-size:11px}
  .tile.poison{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .tile.poison .tag{position:absolute;top:2px;left:4px;font-size:11px}
  .actions{display:flex;gap:8px;margin-bottom:12px}
  .btn{flex:1;padding:13px;border-radius:13px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--text);font-weight:700;font-size:15px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,#2f8b66,#1f6d4e);border-color:transparent}
  .btn.ghost{flex:0 0 auto;padding:13px 16px}
  .msg{min-height:20px;text-align:center;font-size:13px;font-weight:600;margin-bottom:8px}
  .msg.ok{color:var(--green)}.msg.bad{color:var(--red)}
  .found{display:flex;flex-wrap:wrap;gap:6px}
  .found span{font-size:12px;padding:4px 9px;border-radius:9px;background:rgba(79,197,150,.13);border:1px solid rgba(79,197,150,.3);font-weight:700}
  .found span b{color:var(--gold)}
  .center{text-align:center}
  .big{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0}
  .rules{font-size:13px;color:var(--muted);line-height:1.7;text-align:left;max-width:460px;margin:14px auto}
  .rules b{color:var(--text)}
  .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
  .legend i{font-style:normal;padding:2px 7px;border-radius:7px;border:1px solid var(--stroke)}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="backLink" href="./index.html">← Назад</a>
  <script>(function(){var u=new URLSearchParams(location.search).get('u');document.getElementById('backLink').href='./index.html'+(u?('?u='+encodeURIComponent(u)):'');})();</script>
  <h1>WORD&nbsp;<span>FORGE</span></h1>
  <div class="best" id="best">рекорд: —</div>
</div>
<div class="wrap"><div class="card" id="card"></div></div>

<script>
const _qp=new URLSearchParams(location.search), PROFILE=_qp.get('u')||'me';
const BKEY='wf_best'+(PROFILE==='me'?'':'_'+PROFILE);
const $=id=>document.getElementById(id);
const ROUNDS=5, ROUND_SEC=75, MIN_LEN=3;

// цінність літер (рідкісні — дорожчі)
const VAL={'а':1,'о':1,'е':1,'и':1,'і':1,'н':1,'т':1,'р':1,'с':1,'в':1,'к':2,'л':2,'д':2,'м':2,'п':2,'у':2,'я':2,
'б':3,'г':3,'з':3,'й':2,'ь':1,'ч':3,'х':3,'ж':4,'ю':4,'є':4,'ї':4,'ц':4,'ш':4,'щ':6,'ф':5,'ґ':6};
const letterVal=ch=>VAL[ch]||2;

// вбудований словник (іменники/слова у словниковій формі)
const WORDS=("рік дім сік лід ніч сон ліс сад мак рак кіт рот ніс вік бік рів дар жар пар час газ віз рис лис вус мед під над рід вид код мир сир дуб зуб суп лоб гриб гра рука нога вода небо море поле село місто мова слово діло тіло рука очі вухо ніс зуби губа щока лоб брова коса вуса борода палець нога рука плече спина живіт серце мозок кров кістка "+
"кава чай сік мед сіль цукор хліб масло сир яйце м'ясо риба борщ каша суп салат перець часник цибуля морква буряк капуста огірок помідор картопля яблуко груша слива вишня диня кавун виноград лимон банан горіх ягода малина полуниця "+
"дерево квітка трава листя корінь гілка кущ ліс поле луг гора річка озеро море хмара дощ сніг вітер грім блискавка сонце місяць зірка небо земля вогонь дим "+
"кіт пес кінь корова свиня коза вівця курка півень гуска качка риба жаба змія миша щур заєць лисиця вовк ведмідь олень лось їжак білка бобер "+
"птах орел сокіл ворона голуб горобець синиця сова лебідь журавель бджола оса муха комар павук метелик "+
"стіл стілець ліжко шафа полиця вікно двері стіна підлога стеля дах кухня кімната ванна двір паркан ворота міст дорога стежка "+
"книга ручка олівець зошит папір фарба пензель ножиці клей лінійка гумка сумка рюкзак валіза гаманець ключ замок "+
"машина автобус потяг літак корабель човен велосипед колесо мотор кермо "+
"робота гроші банк ринок магазин крамниця товар ціна знижка каса чек "+
"друг сусід родина мати батько син дочка брат сестра дід баба онук "+
"день ніч ранок вечір тиждень місяць рік весна літо осінь зима "+
"радість сум страх гнів любов надія мрія сила воля розум пам'ять думка "+
"хата пекар лікар вчитель учень майстер швець кухар водій пілот "+
"звук голос пісня музика танець гра казка вірш малюнок кіно театр "+
"світло тінь колір форма розмір вага число літера цифра крапка лінія коло квадрат "+
"пил бруд вода мило рушник щітка віник відро "+
"вогонь жар іскра попіл вугілля свічка ліхтар "+
"золото срібло залізо мідь скло камінь пісок глина цегла "+
"білка лапа хвіст ріг копито крило перо шерсть луска "+
"сон мрія казка диво чудо тайна загадка секрет "+
"біг стрибок крок рух швидкість сила спорт м'яч ворота гол "+
"ложка виделка ніж тарілка чашка склянка каструля сковорода чайник "+
"рос коса роса раса маса каса меса лоза база фаза ваза "+
"кора нора пора гора кара міра віра гира дира лира "+
"мороз береза калина верба дуб клен липа сосна ялина тополя")
.split(/\s+/).filter(w=>w.length>=3);
const WSET=new Set(WORDS);
// сортовані «ключі» мультимножин для швидкої перевірки підмножини не потрібні — робимо просту перевірку

function letterCount(str){const m={};for(const c of str)m[c]=(m[c]||0)+1;return m;}
function fits(word,rack){const rc=letterCount(rack),need=letterCount(word);for(const c in need){if((rc[c]||0)<need[c])return false;}return true;}

// набір «сідів» (довші слова), з яких генеруємо раунди
const SEEDS=WORDS.filter(w=>w.length>=6&&w.length<=9&&/^[а-яіїєґ']+$/.test(w));

let best=+localStorage.getItem(BKEY)||0;
$('best').textContent=best?('рекорд: '+best):'рекорд: —';

let round=0, total=0, timer=null, timeLeft=0;
let rack='', tiles=[], found=[], validSet=new Set(), special={};

function buildRound(){
  // підбираємо сід так, щоб було достатньо слів
  let tries=0, rk='', valid=[];
  do{
    const seed=SEEDS[Math.floor(Math.random()*SEEDS.length)]||'';
    rk=seed.replace(/'/g,'');
    // додаємо 1-2 випадкові поширені літери
    const extra='аоеинтрсвк';
    const addN=1+Math.floor(Math.random()*2);
    for(let i=0;i<addN;i++)rk+=extra[Math.floor(Math.random()*extra.length)];
    valid=WORDS.filter(w=>w.indexOf("'")<0 && w.length>=MIN_LEN && fits(w,rk));
    tries++;
  }while(valid.length<5 && tries<40);
  rack=rk.split('').sort(()=>Math.random()-0.5).join('');
  validSet=new Set(valid);
  found=[];
  // спецплитки на позиціях
  special={};
  const idxs=[...Array(rack.length).keys()].sort(()=>Math.random()-0.5);
  special[idxs[0]]='mult';            // ×2 для літери
  if(idxs.length>1)special[idxs[1]]='bonus';   // +5 за використання
  if(round>=3 && idxs.length>2)special[idxs[2]]='poison'; // -6 штраф
}

function tileClass(kind){return kind?(' '+kind):'';}
function renderRound(){
  buildRound();
  timeLeft=ROUND_SEC;
  const c=$('card');
  c.innerHTML=`
    <div class="hud"><div>Раунд <b>${round}</b>/${ROUNDS}</div><div>Знайдено <b id="fcount">0</b>/${validSet.size}</div><div>Рахунок <span class="sc" id="score">${total}</span></div></div>
    <div id="timebar"><i id="tb"></i></div>
    <div class="cur" id="cur"><span class="ph">клацай літери й склади слово (мін. ${MIN_LEN})</span></div>
    <div class="rack" id="rack"></div>
    <div class="msg" id="msg"></div>
    <div class="actions">
      <button class="btn ghost" onclick="backspace()">⌫</button>
      <button class="btn primary" onclick="submitWord()">Скласти ✓</button>
      <button class="btn ghost" onclick="clearWord()">✕</button>
    </div>
    <div class="legend"><i style="border-color:var(--gold);color:var(--gold)">★ ×2</i><i style="border-color:var(--cyan);color:var(--cyan)">💎 +5</i><i style="border-color:var(--red);color:var(--red)">☠ −6</i></div>
    <div class="found" id="found"></div>`;
  cur=[]; drawRack(); tick();
}
let cur=[]; // масив {ch, idx}
function drawRack(){
  const r=$('rack');
  r.innerHTML=rack.split('').map((ch,i)=>{
    const kind=special[i]||'';
    const used=cur.some(t=>t.idx===i)?' used':'';
    const tag=kind==='mult'?'<span class="tag">★</span>':kind==='bonus'?'<span class="tag">💎</span>':kind==='poison'?'<span class="tag">☠</span>':'';
    return `<div class="tile${tileClass(kind)}${used}" onclick="tapTile(${i})">${ch.toUpperCase()}${tag}<span class="v">${letterVal(ch)}</span></div>`;
  }).join('');
  const cu=$('cur');
  cu.innerHTML=cur.length?cur.map(t=>t.ch.toUpperCase()).join(''):'<span class="ph">клацай літери й склади слово (мін. '+MIN_LEN+')</span>';
}
function tapTile(i){ if(cur.some(t=>t.idx===i))return; cur.push({ch:rack[i],idx:i}); drawRack(); }
function backspace(){ cur.pop(); drawRack(); }
function clearWord(){ cur=[]; drawRack(); }
function msg(t,ok){const m=$('msg');if(!m)return;m.textContent=t;m.className='msg '+(ok?'ok':'bad');}

function submitWord(){
  const word=cur.map(t=>t.ch).join('');
  if(word.length<MIN_LEN){msg('Мінімум '+MIN_LEN+' літери',0);return;}
  if(found.includes(word)){msg('Вже склав це слово',0);return;}
  if(!validSet.has(word)){msg('«'+word.toUpperCase()+'» — немає в словнику',0);clearWord();return;}
  // рахунок
  let base=0, note=[];
  cur.forEach(t=>{let v=letterVal(t.ch);if(special[t.idx]==='mult'){v*=2;note.push('★');}base+=v;});
  const lenMult=1+Math.max(0,word.length-3)*0.3;
  let sc=Math.round(base*lenMult);
  let bonus=0;
  cur.forEach(t=>{if(special[t.idx]==='bonus'){bonus+=5;note.push('💎');}if(special[t.idx]==='poison'){bonus-=6;note.push('☠');}});
  sc+=bonus;
  if(sc<0)sc=0;
  total+=sc; found.push(word);
  $('score').textContent=total; $('fcount').textContent=found.length;
  const f=$('found');f.innerHTML=found.map(w=>`<span>${w.toUpperCase()} <b>+${wordScoreCache[w]||''}</b></span>`).join('');
  wordScoreCache[word]=sc;
  f.innerHTML=found.map(w=>`<span>${w.toUpperCase()} <b>+${wordScoreCache[w]}</b></span>`).join('');
  msg('+'+sc+' очок'+(note.length?(' '+note.join('')):'')+(word.length>=5?' 🔥':''),1);
  clearWord();
}
const wordScoreCache={};

function tick(){
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    const tb=$('tb');if(tb)tb.style.width=(timeLeft/ROUND_SEC*100)+'%';
    if(timeLeft<=0){clearInterval(timer);endRound();}
  },1000);
  const tb=$('tb');if(tb)tb.style.width='100%';
}

function endRound(){
  clearInterval(timer);
  const c=$('card');
  const missed=[...validSet].filter(w=>!found.includes(w)).sort((a,b)=>b.length-a.length).slice(0,8);
  c.innerHTML=`<div class="center">
    <div style="color:var(--muted);font-size:13px">Раунд ${round} завершено</div>
    <div class="big">${found.length} слів</div>
    <div style="color:var(--gold);font-weight:800;font-size:22px;margin-bottom:6px">разом ${total} очок</div>
    ${missed.length?`<div class="rules center" style="text-align:center"><b>Можна було ще:</b><br>${missed.map(w=>w.toUpperCase()).join(' · ')}</div>`:''}
    <button class="btn primary" style="max-width:280px;margin:14px auto 0" onclick="nextRound()">${round<ROUNDS?'Наступний раунд →':'Підсумок 🏆'}</button>
  </div>`;
}
function nextRound(){ if(round<ROUNDS){round++;renderRound();} else finish(); }

function finish(){
  const c=$('card');
  const isRec=total>best;
  if(isRec){best=total;localStorage.setItem(BKEY,best);$('best').textContent='рекорд: '+best;}
  c.innerHTML=`<div class="center">
    <div class="big">🏆 ${total} очок</div>
    <div style="color:${isRec?'var(--gold)':'var(--muted)'};font-weight:700;margin-bottom:6px">${isRec?'🎉 Новий рекорд!':'рекорд: '+best}</div>
    <button class="btn primary" style="max-width:280px;margin:14px auto 0" onclick="start()">Грати ще 🔁</button>
  </div>`;
}

function start(){ round=1; total=0; renderRound(); }

function intro(){
  $('card').innerHTML=`<div class="center">
    <div class="big">🔤 Word Forge</div>
    <div class="rules">
      Щораунду дається набір <b>літер</b> (кожна має свою ціну — рідкісні дорожчі).<br>
      Склади якнайбільше <b>справжніх слів</b> (мін. ${MIN_LEN} літери), кожну літеру — скільки разів показана.<br>
      <b>★ ×2</b> — подвоює ціну своєї літери · <b>💎</b> — +5 очок за використання · <b>☠</b> — −6 штраф.<br>
      Довші слова коштують більше (множник за довжину). ${ROUNDS} раундів по ${ROUND_SEC} с.
    </div>
    <button class="btn primary" style="max-width:280px;margin:8px auto 0" onclick="start()">▶ Грати</button>
    <div style="color:var(--muted);font-size:11px;margin-top:12px">Словник вбудований (${WORDS.length} слів) — офлайн. Слів немає? Напиши Владу — розширимо.</div>
  </div>`;
}
// клавіатура
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){submitWord();return;}
  if(e.key==='Backspace'){backspace();return;}
  const ch=e.key.toLowerCase();
  if(rack&&rack.includes(ch)){const i=rack.split('').findIndex((c,idx)=>c===ch&&!cur.some(t=>t.idx===idx));if(i>=0){tapTile(i);}}
});
intro();
</script>
</body>
</html>
