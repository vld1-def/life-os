<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>LIFE 🔤 WORD FORGE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c14'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
<style>
  :root{--text:#e7ecf3;--muted:#8791a3;--cyan:#5cc9dd;--purple:#9d8ad6;--stroke:rgba(255,255,255,.1);--green:#4fc596;--red:#e56b7b;--gold:#e3bd68}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 50% -10%,#141a30,#0a0c14 70%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  a.back{color:var(--text);text-decoration:none;background:rgba(255,255,255,.07);border:1px solid var(--stroke);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600}
  h1{font-size:20px;margin:0;letter-spacing:1px}
  h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
  .best{font-size:12px;color:var(--muted)}
  .wrap{width:100%;max-width:520px}
  .card{border:1px solid var(--stroke);border-radius:20px;background:linear-gradient(180deg,#141a30,#0e1120);padding:18px}
  .hud{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
  .hud b{color:var(--text);font-size:16px}
  .hud .sc{color:var(--gold);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  #timebar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:14px}
  #timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .25s linear}
  .cur{min-height:52px;border:1px dashed var(--stroke);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;letter-spacing:3px;margin-bottom:12px;padding:6px;flex-wrap:wrap}
  .cur .ph{color:var(--muted);font-size:15px;font-weight:500;letter-spacing:0}
  .rack{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
  .tile{position:relative;aspect-ratio:1/1;border-radius:13px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;user-select:none;transition:.1s}
  .tile:active{transform:scale(.9)}
  .tile.used{opacity:.25;pointer-events:none}
  .tile.pick{outline:2px solid var(--cyan);outline-offset:2px}
  .tile .v{position:absolute;bottom:4px;right:6px;font-size:11px;font-weight:700;color:var(--muted)}
  .tile.mult{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .tile.mult .tag,.tile.bonus .tag,.tile.poison .tag{position:absolute;top:3px;left:5px;font-size:11px;font-weight:800}
  .tile.mult .tag{color:var(--gold)}
  .tile.bonus{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
  .tile.poison{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .powers{display:flex;gap:7px;margin-bottom:10px}
  .pw{flex:1;padding:9px 6px;border-radius:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer}
  .pw:disabled{opacity:.35;cursor:default}
  .pw:active:not(:disabled){transform:scale(.96)}
  .actions{display:flex;gap:8px;margin-bottom:10px}
  .btn{flex:1;padding:13px;border-radius:13px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--text);font-weight:700;font-size:15px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(90deg,#2f8b66,#1f6d4e);border-color:transparent}
  .btn.ghost{flex:0 0 auto;padding:13px 16px}
  .msg{min-height:20px;text-align:center;font-size:13px;font-weight:600}
  .msg.ok{color:var(--green)}.msg.bad{color:var(--red)}.msg.gold{color:var(--gold)}
  .center{text-align:center}
  .big{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0}
  .rules{font-size:13px;color:var(--muted);line-height:1.7;text-align:left;max-width:440px;margin:14px auto}
  .rules b{color:var(--text)}
  .legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
  .legend i{font-style:normal;padding:2px 7px;border-radius:7px;border:1px solid var(--stroke)}
</style>
</head>

// ще доповнення (більший словник)
"алея армія азот акула апарат банка билина буква вежа вода воля ворог гараж герой гілка гриб гроза дама дача діра дошка драбина ера ефір жаба жага жало жир завод захід зброя зерно зима зона іграшка ідея їжа кабан казан калюжа канава квас квота кит клас клен клин коза колба колір колос конус копил корж кошик крапка куля лава лада лебідь лінза липа лоза лужа люк льон маля мана мед межа мідь моль мошка мул муляр набір навіс налив намет нива нирка ніша нога нора носик нота обід образ обруч оса острів отара пава палата панда пара парта паста паша печера пилка піна пісок плита плід поле пора порт порядок посуд потік похід призма пух рама рана роса рудник саж сани сани сатин світ село сила сітка скеля скло слон смак сова солома сom сон сорт спека спис стеля степ стіг сук суп тайна тато тінь товар тоска трава труба тур туча удар узвар узор ураган урок факел фарба ферма фото хазяїн халат хата хвиля хижа хмара хома хор хула цап цегла цибуля цирк час чашка чек черга черево число чоло чорт чуб шайба шапка шар шаром шафа шина шипшина шкіра шлях шов штора шум щавель щастя щока щука ялина ясен яхта")
.split(/\s+/).map(w=>w.toLowerCase().trim()).filter(w=>w.length>=3 && /^[а-яіїєґ']+$/.test(w));
const WSET=new Set(WORDS);
const WORDS_U=[...WSET];
const SEEDS=WORDS_U.filter(w=>w.indexOf("'")<0 && w.length>=6 && w.length<=9);

function letterCount(str){const m={};for(const c of str)m[c]=(m[c]||0)+1;return m;}
function fits(word,rc){const need=letterCount(word);for(const c in need){if((rc[c]||0)<need[c])return false;}return true;}
const POOL='ааааоооееииіінтрсвклдмпуяб';
const randLetter=()=>POOL[Math.floor(Math.random()*POOL.length)];

let best=+localStorage.getItem(BKEY)||0;
$('best').textContent=best?('рекорд: '+best):'рекорд: —';

let round=0, total=0, timer=null, timeLeft=0;
let tiles=[], validSet=new Set(), cur=[], pu={swap:0,hint:0}, swapMode=false;

function computeValid(){const rc=letterCount(tiles.map(t=>t.ch).join(''));validSet=new Set(WORDS_U.filter(w=>w.indexOf("'")<0&&w.length>=MIN_LEN&&fits(w,rc)));}

function buildRound(){
  let tr=0, rk='', valid=[];
  do{
    const seed=SEEDS[Math.floor(Math.random()*SEEDS.length)]||'слово';
    rk=seed.replace(/'/g,'');
    while(rk.length<RACK_N)rk+=randLetter();
    if(rk.length>RACK_N)rk=rk.slice(0,RACK_N);
    valid=WORDS_U.filter(w=>w.indexOf("'")<0&&w.length>=MIN_LEN&&fits(w,letterCount(rk)));
    tr++;
  }while(valid.length<8 && tr<80);
  const arr=rk.split('').sort(()=>Math.random()-0.5);
  tiles=arr.map(ch=>({ch,kind:''}));
  const idxs=[...Array(tiles.length).keys()].sort(()=>Math.random()-0.5);
  tiles[idxs[0]].kind='mult';
  tiles[idxs[1]].kind='bonus';
  if(round>=3)tiles[idxs[2]].kind='poison';
  cur=[];swapMode=false;
  computeValid();
}

function renderRound(){
  buildRound();
  if(round===5){pu.swap++;} // бонус 5-го раунду: заміна букви
  timeLeft=ROUND_SEC;
  $('card').innerHTML=`
    <div class="hud"><div>Раунд <b>${round}</b>/${ROUNDS}</div><div>1 слово</div><div>Рахунок <span class="sc" id="score">${total}</span></div></div>
    <div id="timebar"><i id="tb"></i></div>
    <div class="cur" id="cur"></div>
    <div class="rack" id="rack"></div>
    <div class="powers" id="powers"></div>
    <div class="actions">
      <button class="btn ghost" onclick="backspace()">⌫</button>
      <button class="btn primary" onclick="submitWord()">Скласти ✓</button>
      <button class="btn ghost" onclick="clearWord()">✕</button>
    </div>
    <div class="msg" id="msg">${round===5?'🎁 Бонус раунду: заміна букви!':''}</div>
    <div class="legend"><i style="border-color:var(--gold);color:var(--gold)">★ ×2</i><i style="border-color:var(--cyan);color:var(--cyan)">💎 таємний бонус</i><i style="border-color:var(--red);color:var(--red)">☠ −6</i></div>`;
  drawRack(); drawPowers(); tick();
}
function drawRack(){
  $('rack').innerHTML=tiles.map((t,i)=>{
    const used=cur.some(c=>c.idx===i)?' used':'';const pick=swapMode?' pick':'';
    const tag=t.kind==='mult'?'<span class="tag">★</span>':t.kind==='bonus'?'<span class="tag">💎</span>':t.kind==='poison'?'<span class="tag">☠</span>':'';
    return `<div class="tile${t.kind?(' '+t.kind):''}${used}${pick}" onclick="tapTile(${i})">${t.ch.toUpperCase()}${tag}<span class="v">${letterVal(t.ch)}</span></div>`;
  }).join('');
  const c=$('cur');if(c)c.innerHTML=cur.length?cur.map(t=>t.ch.toUpperCase()).join(''):'<span class="ph">склади одне слово (мін. '+MIN_LEN+')</span>';
}
function drawPowers(){
  const p=$('powers');if(!p)return;
  p.innerHTML=`<button class="pw" onclick="shuffleRack()">🔀 Перемішати</button>
    <button class="pw" ${pu.swap>0?'':'disabled'} onclick="useSwap()">♻ Заміна${pu.swap>0?' ('+pu.swap+')':''}</button>
    <button class="pw" ${pu.hint>0?'':'disabled'} onclick="useHint()">💡 Підказка${pu.hint>0?' ('+pu.hint+')':''}</button>`;
}
function tapTile(i){
  if(swapMode){const nc=randLetter();tiles[i]={ch:nc,kind:tiles[i].kind};swapMode=false;cur=cur.filter(t=>t.idx!==i);computeValid();drawRack();drawPowers();msg('Замінено на «'+nc.toUpperCase()+'»',1);return;}
  if(cur.some(t=>t.idx===i))return;cur.push({ch:tiles[i].ch,idx:i});drawRack();
}
function backspace(){cur.pop();drawRack();}
function clearWord(){cur=[];drawRack();}
function msg(t,type){const m=$('msg');if(m){m.textContent=t;m.className='msg '+(type===1?'ok':type===2?'gold':'bad');}}
function shuffleRack(){const order=[...Array(tiles.length).keys()].sort(()=>Math.random()-0.5);tiles=order.map(i=>tiles[i]);cur=[];drawRack();msg('Перемішано 🔀',1);}
function useSwap(){if(pu.swap<=0)return;pu.swap--;swapMode=true;drawRack();drawPowers();msg('Тапни літеру, яку замінити',2);}
function useHint(){if(pu.hint<=0)return;pu.hint--;const opts=[...validSet].filter(w=>w.length>=3&&w.length<=5);const w=opts.length?opts[Math.floor(Math.random()*opts.length)]:[...validSet][0];drawPowers();msg('💡 Спробуй: '+(w?w.toUpperCase():'—'),2);}

function scoreWord(){
  let base=0,used=cur.map(t=>tiles[t.idx].kind);
  cur.forEach(t=>{let v=letterVal(t.ch);if(tiles[t.idx].kind==='mult')v*=2;base+=v;});
  const lenMult=1+Math.max(0,cur.length-3)*0.3;
  let sc=Math.round(base*lenMult);
  cur.forEach(t=>{if(tiles[t.idx].kind==='poison')sc-=6;});
  return {sc:Math.max(0,sc), diamond:used.includes('bonus')};
}
function submitWord(){
  const word=cur.map(t=>t.ch).join('');
  if(word.length<MIN_LEN){msg('Мінімум '+MIN_LEN+' літери',0);return;}
  if(!validSet.has(word)){msg('«'+word.toUpperCase()+'» немає в словнику',0);return;}
  const {sc,diamond}=scoreWord();
  total+=sc;
  let secret='';
  if(diamond){const kind=Math.random()<0.5?'swap':'hint';pu[kind]++;secret=(kind==='swap'?'♻ заміна букви':'💡 підказка');}
  roundDone(word,sc,secret);
}
function roundDone(word,sc,secret){
  clearInterval(timer);
  const bestW=[...validSet].sort((a,b)=>b.length-a.length||0)[0]||'';
  $('card').innerHTML=`<div class="center">
    <div style="color:var(--muted);font-size:13px">Раунд ${round}/${ROUNDS}</div>
    <div class="big">${word?word.toUpperCase():'— пропуск —'}</div>
    <div style="color:var(--gold);font-weight:800;font-size:24px">+${sc} очок</div>
    <div style="color:var(--muted);font-size:13px;margin-top:8px">Разом: <b style="color:var(--text)">${total}</b></div>
    ${secret?`<div style="color:var(--cyan);font-weight:700;font-size:14px;margin-top:8px">💎 Таємний бонус: ${secret}!</div>`:''}
    ${bestW&&bestW!==word?`<div class="rules" style="text-align:center;margin-top:10px">Найдовше можливе: <b>${bestW.toUpperCase()}</b> (${bestW.length} лт)</div>`:''}
    <button class="btn primary" style="max-width:280px;margin:16px auto 0" onclick="nextRound()">${round<ROUNDS?'Наступний раунд →':'Підсумок 🏆'}</button>
  </div>`;
}
function tick(){
  clearInterval(timer);const tb=$('tb');if(tb)tb.style.width='100%';
  timer=setInterval(()=>{
    timeLeft--;const tb=$('tb');if(tb)tb.style.width=(timeLeft/ROUND_SEC*100)+'%';
    if(timeLeft<=0){clearInterval(timer);
      const w=cur.map(t=>t.ch).join('');
      if(w.length>=MIN_LEN&&validSet.has(w)){const {sc,diamond}=scoreWord();total+=sc;let secret='';if(diamond){const kind=Math.random()<0.5?'swap':'hint';pu[kind]++;secret=(kind==='swap'?'♻ заміна':'💡 підказка');}roundDone(w,sc,secret);}
      else roundDone('',0,'');
    }
  },1000);
}
function nextRound(){if(round<ROUNDS){round++;renderRound();}else finish();}
function finish(){
  const isRec=total>best;
  if(isRec){best=total;localStorage.setItem(BKEY,best);$('best').textContent='рекорд: '+best;}
  $('card').innerHTML=`<div class="center">
    <div class="big">🏆 ${total} очок</div>
    <div style="color:${isRec?'var(--gold)':'var(--muted)'};font-weight:700;margin-bottom:6px">${isRec?'🎉 Новий рекорд!':'рекорд: '+best}</div>
    <button class="btn primary" style="max-width:280px;margin:14px auto 0" onclick="start()">Грати ще 🔁</button>
  </div>`;
}
function start(){round=1;total=0;pu={swap:0,hint:0};renderRound();}
function intro(){
  $('card').innerHTML=`<div class="center">
    <div class="big">🔤 Word Forge</div>
    <div class="rules">
      Поле <b>4×4 (16 літер)</b>, кожна має ціну (рідкісні дорожчі).<br>
      <b>1 раунд = 1 слово</b>: склади одне справжнє слово (мін. ${MIN_LEN} лт), ${ROUNDS} раундів по ${ROUND_SEC} с.<br>
      <b>★ ×2</b> подвоює ціну літери · <b>☠ −6</b> штраф.<br>
      <b>💎</b> якщо використаєш літеру з діамантом — <b>таємний бонус</b> (заміна або підказка).<br>
      На <b>5-му раунді</b> — безкоштовна заміна букви.<br>
      Бонуси: <b>🔀 перемішати</b>, <b>♻ заміна букви</b>, <b>💡 підказка</b>. Довші слова коштують більше.
    </div>
    <button class="btn primary" style="max-width:280px;margin:8px auto 0" onclick="start()">▶ Грати</button>
    <div style="color:var(--muted);font-size:11px;margin-top:12px">Словник вбудований (${WORDS_U.length} слів) — офлайн.</div>
  </div>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){submitWord();return;}
  if(e.key==='Backspace'){backspace();return;}
  const ch=(e.key||'').toLowerCase();
  if(tiles.length&&!swapMode){const i=tiles.findIndex((t,idx)=>t.ch===ch&&!cur.some(c=>c.idx===idx));if(i>=0)tapTile(i);}
});
intro();
</script>
</body>
</html>
