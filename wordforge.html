"сабля сад садиба сажа саквояж сакля салат сало салют самокат сани сани сапка сарана сарай сатин сафарі сваха світло свиня свисток свічка свобода сектор село серп сир сироп сич сідло сіль сіно сітка скарб скеля скло сковорода скрипка слива слон слово смак смерека смородина сніг сова совок сокира сокіл соловей солома сон соняшник сопілка сорочка сорт сосна софа спадок спека спис спорт стіл стіна стовп стрічка струмок студент суддя сук сукня султан суп сурма сучок "+
"табір таблиця таємниця такса такт талан талант танк танок таран тарілка театр телефон тема темрява тепло терен терези терн тесля течія тигр тин тир тиша тисяча тінь тканина товар тополя торба торнадо торт трава трактор трамвай транспорт трапеза траса тремтіння третина тризуб троянда труба трюм туман тунель тур турбіна тюльпан тютюн "+
"убрання увага угода узвар узгіря указ укіс улов умова упряж урна урок ущелина "+
"фабрика фаза факел факт фара фартух фарфор фасад фах фаянс фей ферма фея фігура фіалка фінал фініш фірма флейта флот фойє фонтан форель форт фото фрак фреска фрукт "+
"хабар халат халва хан характер хата хащі хвала хвиля хвіртка хвіст хижак хижка хист хитрощі хід хліб хмара хмиз холод хом'як хор храм хребет хрест хрін хрущ хустка "+
"цап цар царина цвіт цебро цегла цемент центр цибуля цикада цимбали цирк цистерна цифра цукерка цукор цуцик "+
"чабан чай чайка чапля чар час частина чашка чек черга черево череда черемха черепаха черешня чернетка чех чигун чиж число чобіт човен чоло чоловік чорнило чорт чортополох чуб чудо чужина чуприна "+
"шабля шайба шайка шакал шалаш шампунь шапка шар шафа шафран шахта шашка шведка швейцар швея шелест шерсть шеф шило шина шипшина широчінь шишка шкаралупа шкіра школа шкура шлях шматок шнур шов шоколад шолом шомпол шофер шпак шпалери шпилька шпунт штаб штанга штат штиль штора шторм штука шум шуруп "+
"щавель щастя щедрість щедрівка щеня щербина щиголь щит щока щука щур "+
"юга юнак юрба юрта юшка "+
"ябеда ябко яблуко явір явище ягня ягода язик яйце якір якут ялина ялинка ялиця яма ямка ярд ярина ярмарок ярус ясен яскравість яструб яхта яхтсмен ячмінь")
.split(/\s+/).map(w=>w.toLowerCase().trim()).filter(w=>w.length>=3 && /^[а-яіїєґ']+$/.test(w));
const WSET=new Set(WORDS);
const WORDS_U=[...WSET];
const SEEDS=WORDS_U.filter(w=>w.indexOf("'")<0 && w.length>=6 && w.length<=9);

function letterCount(str){const m={};for(const c of str)m[c]=(m[c]||0)+1;return m;}
function fits(word,rc){const need=letterCount(word);for(const c in need){if((rc[c]||0)<need[c])return false;}return true;}
const POOL='ааааоооееииіінтрсвклдмпуяб';
const randLetter=()=>POOL[Math.floor(Math.random()*POOL.length)];

let best=+localStorage.getItem(BKEY)||0;
$('best').textContent=best?('рекорд: '+best):'рекорд: —';

let round=0, total=0, endTO=null;
let tiles=[], validSet=new Set(), cur=[], pu={swap:0,hint:0}, swapMode=false, pickIdx=-1;

function computeValid(){const rc=letterCount(tiles.map(t=>t.ch).join(''));validSet=new Set(WORDS_U.filter(w=>w.indexOf("'")<0&&w.length>=MIN_LEN&&fits(w,rc)));}

function buildRound(){
  let tr=0, rk='', valid=[];
  do{
    const seed=SEEDS[Math.floor(Math.random()*SEEDS.length)]||'слово';
    rk=seed.replace(/'/g,'');
    while(rk.length<RACK_N)rk+=randLetter();
    if(rk.length>RACK_N)rk=rk.slice(0,RACK_N);
    valid=WORDS_U.filter(w=>w.indexOf("'")<0&&w.length>=MIN_LEN&&fits(w,letterCount(rk)));
    tr++;
  }while(valid.length<8 && tr<80);
  const arr=rk.split('').sort(()=>Math.random()-0.5);
  tiles=arr.map(ch=>({ch,kind:'',mx:0}));
  const idxs=[...Array(tiles.length).keys()].sort(()=>Math.random()-0.5);
  tiles[idxs[0]].kind='mult';tiles[idxs[0]].mx=(round>=6&&Math.random()<0.5)?3:2;
  tiles[idxs[1]].kind='bonus';
  if(round>=3)tiles[idxs[2]].kind='poison';
  if(round>=6){tiles[idxs[3]].kind='mult';tiles[idxs[3]].mx=2;}
  cur=[];swapMode=false;pickIdx=-1;
  computeValid();
}

function renderRound(){
  buildRound();
  if(round===5)pu.swap++;
  $('card').innerHTML=`
    <div class="hud"><div>Раунд <b>${round}</b>/${ROUNDS}</div><div>1 слово</div><div>Рахунок <span class="sc" id="score">${total}</span></div></div>
    <div id="timebar"><i id="tb"></i></div>
    <div class="cur" id="cur"></div>
    <div class="rack" id="rack"></div>
    <div class="powers" id="powers"></div>
    <div class="actions">
      <button class="btn ghost" onclick="backspace()">⌫</button>
      <button class="btn primary" onclick="submitWord()">Скласти ✓</button>
      <button class="btn ghost" onclick="clearWord()">✕</button>
    </div>
    <div class="msg" id="msg">${round===5?'🎁 Бонус раунду: заміна букви!':''}</div>
    <div class="legend"><i style="border-color:var(--gold);color:var(--gold)">★ множник</i><i style="border-color:var(--cyan);color:var(--cyan)">💎 таємний бонус</i><i style="border-color:var(--cherry);color:#c76">☠ −6</i></div>`;
  drawRack();drawPowers();startTimer();
}
function drawRack(){
  $('rack').innerHTML=tiles.map((t,i)=>{
    const used=cur.some(c=>c.idx===i)?' used':'';const pick=(swapMode)?' pick':'';
    const tag=t.kind==='mult'?('<span class="tag">×'+t.mx+'</span>'):t.kind==='bonus'?'<span class="tag">💎</span>':t.kind==='poison'?'<span class="tag">☠</span>':'';
    return `<div class="tile${t.kind?(' '+t.kind):''}${used}${pick}" onclick="tapTile(${i})">${t.ch.toUpperCase()}${tag}<span class="v">${letterVal(t.ch)}</span></div>`;
  }).join('');
  updateCur();
}
function updateCur(){
  const c=$('cur');if(!c)return;
  if(!cur.length){c.innerHTML='<span class="ph">склади одне слово (мін. '+MIN_LEN+')</span>';return;}
  const word=cur.map(t=>t.ch).join('');
  const valid=validSet.has(word)&&word.length>=MIN_LEN;
  const sc=scoreWord().sc;
  c.innerHTML=`<span class="w">${word.toUpperCase()}</span><span class="live ${valid?'ok':'no'}">${valid?('= '+sc):('~'+sc)}</span>`;
}
function tapTile(i){
  if(swapMode){pickIdx=i;openPicker();return;}
  if(cur.some(t=>t.idx===i))return;cur.push({ch:tiles[i].ch,idx:i});drawRack();
}
function backspace(){cur.pop();drawRack();}
function clearWord(){cur=[];drawRack();}
function msg(t,type){const m=$('msg');if(m){m.textContent=t;m.className='msg '+(type===1?'ok':type===2?'gold':'bad');}}
function drawPowers(){
  const p=$('powers');if(!p)return;
  p.innerHTML=`<button class="pw" onclick="shuffleRack()">🔀 Перемішати</button>
    <button class="pw" ${pu.swap>0?'':'disabled'} onclick="useSwap()">♻ Заміна${pu.swap>0?' ('+pu.swap+')':''}</button>
    <button class="pw" ${pu.hint>0?'':'disabled'} onclick="useHint()">💡 Підказка${pu.hint>0?' ('+pu.hint+')':''}</button>`;
}
function shuffleRack(){const order=[...Array(tiles.length).keys()].sort(()=>Math.random()-0.5);tiles=order.map(i=>tiles[i]);cur=[];drawRack();msg('Перемішано 🔀',1);}
function useSwap(){if(pu.swap<=0)return;pu.swap--;swapMode=true;drawRack();drawPowers();msg('Тапни клітинку, яку хочеш замінити',2);}
function useHint(){if(pu.hint<=0)return;pu.hint--;const opts=[...validSet].filter(w=>w.length>=3&&w.length<=5);const w=opts.length?opts[Math.floor(Math.random()*opts.length)]:[...validSet][0];drawPowers();msg('💡 Спробуй: '+(w?w.toUpperCase():'—'),2);}
function openPicker(){
  const pk=document.createElement('div');pk.className='picker';pk.id='pk';
  pk.innerHTML=`<h3>Обери літеру для клітинки</h3><div class="letters">${ALPHA.map(ch=>`<button onclick="pickLetter('${ch}')">${ch.toUpperCase()}</button>`).join('')}</div><button class="btn" style="max-width:200px;margin-top:14px" onclick="closePicker()">Скасувати</button>`;
  $('card').appendChild(pk);
}
function closePicker(){const pk=$('pk');if(pk)pk.remove();swapMode=false;pickIdx=-1;drawRack();drawPowers();}
function pickLetter(ch){
  if(pickIdx>=0){tiles[pickIdx]={ch,kind:tiles[pickIdx].kind,mx:tiles[pickIdx].mx};cur=cur.filter(t=>t.idx!==pickIdx);computeValid();}
  const pk=$('pk');if(pk)pk.remove();swapMode=false;pickIdx=-1;drawRack();drawPowers();msg('Замінено на «'+ch.toUpperCase()+'»',1);
}
function scoreWord(){
  let base=0,diamond=false;
  cur.forEach(t=>{const tl=tiles[t.idx];let v=letterVal(t.ch);if(tl.kind==='mult')v*=tl.mx;base+=v;if(tl.kind==='bonus')diamond=true;});
  const lenMult=1+Math.max(0,cur.length-3)*0.3;
  let sc=Math.round(base*lenMult);
  cur.forEach(t=>{if(tiles[t.idx].kind==='poison')sc-=6;});
  return {sc:Math.max(0,sc), diamond};
}
function submitWord(){
  const word=cur.map(t=>t.ch).join('');
  if(word.length<MIN_LEN){msg('Мінімум '+MIN_LEN+' літери',0);return;}
  if(!validSet.has(word)){msg('«'+word.toUpperCase()+'» немає в словнику',0);return;}
  const {sc,diamond}=scoreWord();total+=sc;
  let secret='';
  if(diamond){const kind=Math.random()<0.5?'swap':'hint';pu[kind]++;secret=(kind==='swap'?'♻ заміна букви':'💡 підказка');}
  roundDone(word,sc,secret);
}
function roundDone(word,sc,secret){
  clearTimeout(endTO);
  const bestW=[...validSet].sort((a,b)=>b.length-a.length||0)[0]||'';
  $('card').innerHTML=`<div class="center">
    <div style="color:var(--muted);font-size:13px">Раунд ${round}/${ROUNDS}</div>
    <div class="big">${word?word.toUpperCase():'— пропуск —'}</div>
    <div style="color:var(--gold);font-weight:800;font-size:24px">+${sc} очок</div>
    <div style="color:var(--muted);font-size:13px;margin-top:8px">Разом: <b style="color:var(--text)">${total}</b></div>
    ${secret?`<div style="color:var(--cyan);font-weight:700;font-size:14px;margin-top:8px">💎 Таємний бонус: ${secret}!</div>`:''}
    ${bestW&&bestW!==word?`<div class="rules" style="text-align:center;margin-top:10px">Найдовше можливе: <b>${bestW.toUpperCase()}</b> (${bestW.length} лт)</div>`:''}
    <button class="btn primary" style="max-width:280px;margin:16px auto 0" onclick="nextRound()">${round<ROUNDS?'Наступний раунд →':'Підсумок 🏆'}</button>
  </div>`;
}
function startTimer(){
  clearTimeout(endTO);
  const tb=$('tb');if(tb){tb.style.transition='none';tb.style.width='100%';void tb.offsetWidth;tb.style.transition='width '+ROUND_SEC+'s linear';tb.style.width='0%';}
  endTO=setTimeout(()=>{
    const w=cur.map(t=>t.ch).join('');
    if(w.length>=MIN_LEN&&validSet.has(w)){const {sc,diamond}=scoreWord();total+=sc;let secret='';if(diamond){const kind=Math.random()<0.5?'swap':'hint';pu[kind]++;secret=(kind==='swap'?'♻ заміна':'💡 підказка');}roundDone(w,sc,secret);}
    else roundDone('',0,'');
  },ROUND_SEC*1000);
}
function nextRound(){if(round<ROUNDS){round++;renderRound();}else finish();}
function finish(){
  const isRec=total>best;
  if(isRec){best=total;localStorage.setItem(BKEY,best);$('best').textContent='рекорд: '+best;}
  $('card').innerHTML=`<div class="center">
    <div class="big">🏆 ${total} очок</div>
    <div style="color:${isRec?'var(--gold)':'var(--muted)'};font-weight:700;margin-bottom:6px">${isRec?'🎉 Новий рекорд!':'рекорд: '+best}</div>
    <button class="btn primary" style="max-width:280px;margin:14px auto 0" onclick="start()">Грати ще 🔁</button>
  </div>`;
}
function start(){round=1;total=0;pu={swap:0,hint:0};renderRound();}
function intro(){
  $('card').innerHTML=`<div class="center">
    <div class="big">🔤 Word Forge</div>
    <div class="rules">
      Поле <b>4×4 (16 літер)</b>, кожна має ціну (рідкісні дорожчі).<br>
      <b>1 раунд = 1 слово</b>: склади одне справжнє слово (мін. ${MIN_LEN} лт), ${ROUNDS} раундів по ${ROUND_SEC} с.<br>
      <b style="color:var(--gold)">★ ×2/×3</b> — золоті плитки-множники · <b style="color:var(--cherry)">☠</b> — гнила вишня, −6.<br>
      <b>💎</b> синя плитка: використай її в слові — <b>таємний бонус</b> (заміна або підказка).<br>
      На <b>5-му раунді</b> — безкоштовна заміна букви (сам вибираєш яку літеру поставити).<br>
      Бали рахуються <b>наживо</b>, поки складаєш. Довші слова коштують більше.
    </div>
    <button class="btn primary" style="max-width:280px;margin:8px auto 0" onclick="start()">▶ Грати</button>
    <div style="color:var(--muted);font-size:11px;margin-top:12px">Словник вбудований (${WORDS_U.length} слів) — офлайн.</div>
  </div>`;
}
document.addEventListener('keydown',e=>{
  if($('pk'))return;
  if(e.key==='Enter'){submitWord();return;}
  if(e.key==='Backspace'){backspace();return;}
  const ch=(e.key||'').toLowerCase();
  if(tiles.length&&!swapMode){const i=tiles.findIndex((t,idx)=>t.ch===ch&&!cur.some(c=>c.idx===idx));if(i>=0)tapTile(i);}
});
intro();
</script>
