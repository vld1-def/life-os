name: Weekly summary push

on:
  schedule:
    - cron: '0 17 * * 0'   # неділя 20:00 за Києвом (літо, UTC+3) — тижневий підсумок
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly summary
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_KEY: ${{ secrets.SB_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          npm i web-push@3 --no-save --silent
          node <<'EOF'
          const webpush=require('web-push');
          const https=require('https');
          const get=p=>new Promise((res,rej)=>{https.get(process.env.SB_URL+p,{headers:{apikey:process.env.SB_KEY,Authorization:'Bearer '+process.env.SB_KEY}},r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>res(d));}).on('error',rej);});
          const del=ep=>new Promise(res=>{const u=new URL(process.env.SB_URL+'/rest/v1/push_subs?endpoint=eq.'+encodeURIComponent(ep));const rq=https.request(u,{method:'DELETE',headers:{apikey:process.env.SB_KEY,Authorization:'Bearer '+process.env.SB_KEY}},r=>{r.on('data',()=>{});r.on('end',res);});rq.on('error',res);rq.end();});
          const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          (async()=>{
            webpush.setVapidDetails('mailto:brovladay@gmail.com',process.env.VAPID_PUBLIC,process.env.VAPID_PRIVATE);
            // тиждень = останні 7 днів (Київ, UTC+3)
            const now=new Date(Date.now()+3*3600*1000);
            const week=[];for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);week.push(dkey(d));}
            const wset=new Set(week);
            // дані Влада
            const solo=JSON.parse(await get('/rest/v1/solo?id=eq.me&select=data'));
            const data=(solo[0]&&solo[0].data)||{days:{},settings:{}};
            const S=data.settings||{}; const days=data.days||{};
            const pushEx=(S.exercises||[]).find(e=>/віджим|push/i.test(e.name));
            let daysActive=0,bestPushWeek=0;
            week.forEach(k=>{ if(days[k]) daysActive++; if(pushEx&&days[k]&&days[k].exSets&&days[k].exSets[pushEx.id]) bestPushWeek=Math.max(bestPushWeek,...days[k].exSets[pushEx.id]); });
            // CS2 за тиждень (дельти steam_playtime)
            let cs2=0;
            try{ const sp=JSON.parse(await get('/rest/v1/steam_playtime?select=date,total_minutes&order=date')); for(let i=0;i<sp.length-1;i++){ if(wset.has(sp[i].date)) cs2+=Math.max(0,sp[i+1].total_minutes-sp[i].total_minutes); } }catch(e){}
            // кроки за тиждень (таблиця steps, who=me або null)
            let steps=0;
            try{ const st=JSON.parse(await get('/rest/v1/steps?select=date,raw,who&limit=5000')); const per={}; st.forEach(r=>{ if((r.who||'me')!=='me')return; const dk=String(r.date).slice(0,10); if(!wset.has(dk))return; const sum=String(r.raw||'').split(/[\s,;]+/).map(Number).filter(n=>!isNaN(n)).reduce((a,b)=>a+b,0); per[dk]=Math.max(per[dk]||0,sum); }); steps=Object.values(per).reduce((a,b)=>a+b,0); }catch(e){}
            const parts=[`${daysActive} дн. активності`];
            if(cs2) parts.push(`🎮 CS2 ${cs2} хв`);
            if(steps) parts.push(`👣 ${steps.toLocaleString('uk-UA')} кроків`);
            if(bestPushWeek) parts.push(`💪 рекорд ${bestPushWeek}`);
            const payload=JSON.stringify({title:'📊 Твій тиждень',body:parts.join(' · ')});
            const subs=JSON.parse(await get('/rest/v1/push_subs?select=sub,endpoint'));
            let ok=0;for(const s of subs){ try{ await webpush.sendNotification(s.sub,payload); ok++; }catch(e){ if(e.statusCode===404||e.statusCode===410) await del(s.endpoint); } }
            console.log('weekly summary:',payload,'sent',ok);
          })().catch(e=>{console.error(e);process.exit(1);});
          EOF
